<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Página Virando</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

/* ===== MOBILE PADRÃO ===== */

html, body {

margin:0;
padding:0;

width:100%;
height:100%;

overflow:hidden;

font-family:Arial, Helvetica, sans-serif;

background:#001c40ff;

color:#ffffff;

}

/* ===== APP WRAPPER ===== */

.app-wrapper {

width:100%;
height:100%;

position:relative;

overflow:hidden;

background:#001c40ff;

}

/* ===== DESKTOP CENTRALIZADO ===== */

@media (min-width:868px){

body{

display:flex;

justify-content:center;
align-items:center;

background:#001c40ff;

}

.app-wrapper{

width:490px;
height:844px;

box-shadow:0 0 40px rgba(0,0,0,0.6);

}

}

/* =====================================================
FUNDO FIXO (IMAGEM DE TRÁS)
===================================================== */

.back-page{

position:absolute;

top:0;
left:0;

width:100%;
height:100%;

z-index:1;

}

.back-page img{

width:100%;
height:100%;

object-fit:cover;

}

/* =====================================================
PÁGINA DA FRENTE
===================================================== */

.front-page{

position:absolute;

top:0;
left:0;

width:100%;
height:100%;

z-index:2;

transform-origin:left center;

transition:transform 1s ease-in-out;

transform-style:preserve-3d;

}

/* =====================================================
EFEITO DE VIRAR
===================================================== */

.front-page.flipped{

transform:rotateY(-180deg);

}

/* =====================================================
IMAGEM FRENTE
===================================================== */

.front-page img{

width:100%;
height:100%;

object-fit:cover;

backface-visibility:hidden;

}

/* =====================================================
BOTÕES
===================================================== */

.page-btn{

position:absolute;

bottom:40px;

padding:14px 24px;

background:#00285f;

border:2px solid #00eaff;

color:white;

font-size:18px;

cursor:pointer;

border-radius:8px;

z-index:999;

}

/* BOTÃO ABRIR */

#btnAbrir{

right:40px;

}

/* BOTÃO VOLTAR */

#btnVoltar{

left:40px;

display:none;

}

</style>
</head>

<body>

<div class="app-wrapper">

<!-- =====================================================
IMAGEM DE TRÁS (FIXA)
===================================================== -->

<div class="back-page">

<img src="Imagens/papel_Fundo.jpg">

</div>

<!-- =====================================================
IMAGEM DA FRENTE (GIRA)
===================================================== -->

<div class="front-page" id="frontPage">

<img src="Imagens/Sobre_Fundo.jpg">

</div>

<!-- =====================================================
BOTÃO ABRIR
===================================================== -->

<button
class="page-btn"
id="btnAbrir"
onclick="virarPagina()">

Abrir

</button>

<!-- =====================================================
BOTÃO VOLTAR
===================================================== -->

<button
class="page-btn"
id="btnVoltar"
onclick="voltarPagina()">

Voltar

</button>

</div>

<script>

function virarPagina(){

document
.getElementById("frontPage")
.classList
.add("flipped");

/* ESCONDE BOTÃO ABRIR */

document
.getElementById("btnAbrir")
.style.display = "none";

/* MOSTRA BOTÃO VOLTAR */

document
.getElementById("btnVoltar")
.style.display = "block";

}

function voltarPagina(){

document
.getElementById("frontPage")
.classList
.remove("flipped");

/* MOSTRA BOTÃO ABRIR */

document
.getElementById("btnAbrir")
.style.display = "block";

/* ESCONDE BOTÃO VOLTAR */

document
.getElementById("btnVoltar")
.style.display = "none";

}

</script>

</body>
</html>
