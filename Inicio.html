<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Quiz – Museu virtual</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
/* ===== MOBILE PADRÃO ===== */
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, Helvetica, sans-serif;
  background: #001c40ff;
  color: #ffffff;
}

/* ===== APP WRAPPER ===== */
.app-wrapper {
  width: 100%;
  height: 100%;
  position: relative;
  overflow-x: hidden;
  overflow-y: hidden;
  background: #001c40ff;

  background-image: url("Imagens/Fundo_Inicio.jpg");
  background-size: contain;
  background-position: center;
  background-repeat: no-repeat;
  background-color: #001c40ff;
}

/* ===== DESKTOP CENTRALIZADO ===== */
@media (min-width: 868px) {
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    background: #001c40ff;
  }

  .app-wrapper {
    width: 470px;
    height: 834px;
    box-shadow: 0 0 40px rgba(0,0,0,0.6);
  }
}

#overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 59, 92, 0);
  z-index: 1;
}

.main-content {
  position: relative;
  z-index: 2;
  min-height: 100%;
}

/* =====================================================
FORMULÁRIO DO ALUNO
===================================================== */

#studentForm{
  padding: 20px 70px 0 70px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 15px;
}

#studentForm input{
 margin-top: 64vh; /* mantém exatamente a posição atual */
  width: 100%;
  max-width: 320px;
  padding: 14px;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  outline: none;
  background: rgba(255,255,255,0.9);
  color: #000;
  font-weight: bold;
}

#btnEnviar{
  width: 100%;
  display: flex;
  justify-content: center;
  background: transparent;
  border: none;
  cursor: pointer;
}

#btnEnviar img{
  width: 170px;
  max-width: 100%;
  height: auto;
  object-fit: contain;
}
</style>
</head>

<body>

<div class="app-wrapper">  
  
  <div id="overlay"></div>

  <div class="main-content">

    <audio id="audioAcerto" src="Audios/acerto.mp3"></audio>         
    
<!-- =====================================================
FORMULÁRIO DO ALUNO
===================================================== -->

<div id="studentForm">

<input 
type="text"
  id="matricula"
  placeholder="Digite sua matrícula">

<button id="btnEnviar">
   <img src="Imagens/btn_Enviar.png" alt="Play">
</button>

</div>



   </div>

</div>



</body>
</html>
