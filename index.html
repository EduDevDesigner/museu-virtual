<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Início</title>

  
<style>

/* ===== CONFIGURAÇÃO PADRÃO (MOBILE) ===== */
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: 'Orbitron', sans-serif;
  background: #001c40ff;
  color: #fff;
}

/* MOBILE ocupa 100% */
.app-wrapper {
  width: 100%;
  height: 100%;
  position: relative;
  overflow: hidden;
}

/* ===== DESKTOP CENTRALIZADO ===== */
@media (min-width: 768px) {
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    background: #001c40ff;
  }

  .app-wrapper {
    width: 590px;
    height: 944px;
    box-shadow: 0 0 40px rgba(0,0,0,0.6);
  }
}

/* ===== SEU CÓDIGO ORIGINAL ===== */

.background-container {
  position: absolute;
  inset: 0;
  overflow: hidden;
  background: #001c40ff;
  z-index: 0;
}
  
.background-container img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
}
  
.background-container video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
}

.container {
  position: relative;
  z-index: 2;
  display: flex;
  justify-content: center;
  align-items: center;
  width: 100%;
  height: 100%;
}

/* =====================================================
MOLDURA DOS BOTÕES
===================================================== */

.buttons-frame{

position:absolute;

top:78%;
left:50%;

transform:translate(-50%, -50%);

width:80px;
height: 85px;

padding:25px 20px 35px 20px;

border-radius:22px;

background:rgba(5, 0, 38, 0.55);

border:2px solid rgb(0, 234, 255);

backdrop-filter:blur(10px);

box-shadow:
0 0 25px rgba(0,0,0,0.5),
0 0 12px rgba(0,140,255,0.25);

z-index:3;

display:flex;
justify-content:center;
align-items:center;

overflow:visible;

}

/* =====================================================
CONTAINER DOS BOTÕES
===================================================== */

.buttons-container {

position:relative;

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

gap:18px;

width:100%;

}
  

  
.card {
  cursor: pointer;
  padding: 16px 54px;
  width: 200px;
  height: 60px;

  display: flex;
  justify-content: center;
  align-items: center;

  background-color: transparent;
  background-image: url('Imagens/botao.png');
  background-position: center;
  background-size: cover;
  background-repeat: no-repeat;

  border: none;
  outline: none;
  box-shadow: none;

  border-radius: 999px;

  color: #ffffff;  
  letter-spacing: 2px;

  transition: transform 0.25s ease, filter 0.25s ease;
}
  
.card img {
  width: 190px;
  margin-right: 0px;
  vertical-align: middle;
}
  
/* =====================================================
BOTÕES SOMENTE TEXTO
===================================================== */

#btnPlay { 
  width: 120px;
  height: 40px;

  font-size:18px;
  font-weight:bold;

  background:transparent;
  border:none;
  outline:none;

  color:#ffffff;

  box-shadow:none;

  cursor:pointer;

  transition:0.3s;
}

#btnPlay:hover{
  transform:scale(1.08);
  color:#00eaff;
}

#btnSobre {
  width: 120px;
  height: 40px;

  font-size:18px;
  font-weight:bold;

  background:transparent;
  border:none;
  outline:none;

  color:#ffffff;

  box-shadow:none;

  cursor:pointer;

  transition:0.3s;
}

#btnSobre:hover{
  transform:scale(1.08);
  color:#00eaff;
}

#btnCredito {
  width: 120px;
  height: 40px;

  font-size:18px;
  font-weight:bold;

  background:transparent;
  border:none;
  outline:none;

  color:#ffffff;

  box-shadow:none;

  cursor:pointer;

  transition:0.3s;
}

#btnCredito:hover{
  transform:scale(1.08);
  color:#00eaff;
}
  
#btnStart {
  width: 130px;
  height: 25px;
}

#btnStart img {
  width: 120px;
}

.card:hover {
  transform: scale(1.08);
}

@keyframes glowBtn {
  0%   { box-shadow: 0 0 16px rgba(30,144,255,0.5); }
  50%  { box-shadow: 0 0 32px rgba(30,144,255,0.9); }
  100% { box-shadow: 0 0 16px rgba(30,144,255,0.5); }
}

@media (max-width:768px) {
  .card { font-size: 18px; padding: 14px 46px; }
}

@media (max-width:480px) {
  .card { font-size: 16px; padding: 12px 38px; }
}

</style>
</head>

<body>

<!-- ÁUDIO -->
<audio id="menuClickSound" src="Audios/acerto.mp3"></audio>
  
<div class="app-wrapper">

  <div class="background-container" aria-hidden="true">
  <video id="bg-video" playsinline preload="auto">
    <source src="Video/Transicao-Index.mp4" type="video/mp4">
  </video>
</div>

  <audio id="bg-audio" autoplay loop muted>
  </audio>

<!-- =====================================================
MOLDURA
===================================================== -->

<div class="buttons-frame">

  <div class="buttons-container">

  <!-- BOTÃO 1 -->
  <button id="btnPlay" class="continue-btn" onclick="startIntroVideo()">
    Continue
  </button>
    
  <!-- BOTÃO 2 -->
  <button id="btnSobre" class="sobre-btn" onclick="location.href='sobre.html'">
    Sobre
  </button>  
    
  <!-- BOTÃO 3 -->
  <button id="btnCredito" class="credito-btn" onclick="location.href='creditos.html'">
    Créditos
  </button>    

  <!-- BOTÃO 4 -->
  <button id="btnStart" class="card" onclick="location.href='museuAR.html'" style="display:none;">
    <img src="Imagens/btn_Play_now.png" alt="">
  </button>

</div>

</div>

</div>

<script>
  
const audio = document.getElementById('bg-audio');
const video = document.getElementById('bg-video');

const btnPlay = document.getElementById('btnPlay');
const btnSobre = document.getElementById('btnSobre');
const btnCredito = document.getElementById('btnCredito');
const btnStart = document.getElementById('btnStart');

window.addEventListener('load', () => {
  audio.volume = 0.05;
  audio.muted = false;

  video.pause();
  video.currentTime = 0;
});

function startIntroVideo() {
  btnPlay.style.display = "none";
  btnSobre.style.display = "none";
  btnCredito.style.display = "none";
  video.play();
  audio.play();
}

video.addEventListener("ended", () => {
  btnStart.style.display = "flex";
});
 
  
/* CLICK DOS BOTÕES  */  
  
const menuClickSound =
document.getElementById("menuClickSound");

function tocarSomBotao(){

menuClickSound.pause();

menuClickSound.currentTime=0;

menuClickSound.play().catch(()=>{});

}

/* TODOS OS BOTÕES */

document.querySelectorAll("button").forEach(btn=>{

btn.addEventListener("click",()=>{

tocarSomBotao();

});

});  
  
</script>

</body>
</html>
