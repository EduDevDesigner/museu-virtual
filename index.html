<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Início</title>

<style>

/* ===== CONFIGURAÇÃO PADRÃO (MOBILE) ===== */
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: 'Orbitron', sans-serif;
  background: #001c40ff;
  color: #fff;
}

/* MOBILE ocupa 100% */
.app-wrapper {
  width: 100%;
  height: 100%;
  position: relative;
  overflow: hidden;
}

/* ===== DESKTOP CENTRALIZADO ===== */
@media (min-width: 768px) {
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    background: #001c40ff; /* cor das bordas */
  }

  .app-wrapper {
    width: 390px;
    height: 844px;
    box-shadow: 0 0 40px rgba(0,0,0,0.6);
  }
}

/* ===== SEU CÓDIGO ORIGINAL ===== */

.background-container {
  position: absolute;
  inset: 0;
  overflow: hidden;
  background: #001c40ff;
  z-index: 0;
}
  
.background-container img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
}
  
.background-container video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
}

.container {
  position: relative;
  z-index: 2;
  display: flex;
  justify-content: center;
  align-items: center;
  width: 100%;
  height: 100%;
}

.buttons-container {
  position: absolute;
  top: 73%;
  left: 50%;
  transform: translateX(-50%);
  z-index: 4;

  display: flex;
  justify-content: center;
  align-items: center;
}

.card {
  cursor: pointer;
  padding: 16px 54px;
  width: 200px;
  height: 60px;

  display: flex;
  justify-content: center;
  align-items: center;

  
  background-color: transparent;
  background-image: url('Imagens/botao.png');
  background-position: center;
  background-size: cover;
  background-repeat: no-repeat;

  border: none;        /* remove borda */
  outline: none;       /* remove contorno ao clicar */
  box-shadow: none;    /* remove brilho que parece borda */

  border-radius: 999px;

  color: #ffffff;  
  letter-spacing: 2px;
  

  transition: transform 0.25s ease, filter 0.25s ease;
}
  
.card img {
  width: 190px;
  margin-right: 0px;
  vertical-align: middle;
}
  
#btnPlay {
  width: 140px;
  height: 45px;
}

#btnPlay img {
  width: 130px;
}
  
#btnStart {
  width: 130px;
  height: 25px;
}

#btnStart img {
  width: 120px;
}

.card:hover {
  transform: scale(1.08);
  
}

@keyframes glowBtn {
  0%   { box-shadow: 0 0 16px rgba(30,144,255,0.5); }
  50%  { box-shadow: 0 0 32px rgba(30,144,255,0.9); }
  100% { box-shadow: 0 0 16px rgba(30,144,255,0.5); }
}

@media (max-width:768px) {
  .card { font-size: 18px; padding: 14px 46px; }
}

@media (max-width:480px) {
  .card { font-size: 16px; padding: 12px 38px; }
}

</style>
</head>

<body>

<div class="app-wrapper">

  <div class="background-container" aria-hidden="true">
  <video id="bg-video" playsinline preload="auto">
    <source src="Video/Transicao-Index.mp4" type="video/mp4">
  </video>
</div>

  <audio id="bg-audio" autoplay loop muted>
    <source src="Audios/baroque.mp3" type="audio/mpeg">
  </audio>

  <div class="buttons-container">

  <!-- BOTÃO 1 -->
  <button id="btnPlay" class="card" onclick="startIntroVideo()">
    <img src="Imagens/btn_14bis.png" alt="">
  </button>

  <!-- BOTÃO 2 -->
  <button id="btnStart" class="card" onclick="location.href='museuAR.html'" style="display:none;">
    <img src="Imagens/btn_Play_now.png" alt="">
  </button>

</div>

</div>

<script>
  
const audio = document.getElementById('bg-audio');
const video = document.getElementById('bg-video');

const btnPlay = document.getElementById('btnPlay');
const btnStart = document.getElementById('btnStart');

window.addEventListener('load', () => {
  audio.volume = 0.05;
  audio.muted = false;

  video.pause();
  video.currentTime = 0;
});

function startIntroVideo() {
  btnPlay.style.display = "none";
  video.play();
  audio.play();
}

video.addEventListener("ended", () => {
  btnStart.style.display = "flex";
});
  
</script>

</body>
</html>
