<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Início</title>

  
<style>

/* ===== CONFIGURAÇÃO PADRÃO (MOBILE) ===== */
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: 'Orbitron', sans-serif;
  background: #001c40ff;
  color: #fff;
}

/* MOBILE ocupa 100% */
.app-wrapper {
  width: 100%;
  height: 100%;
  position: relative;
  overflow: hidden;
}

/* ===== DESKTOP CENTRALIZADO ===== */
@media (min-width: 768px) {
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    background: #001c40ff;
  }

  .app-wrapper {
    width: 590px;
    height: 944px;
    box-shadow: 0 0 40px rgba(0,0,0,0.6);
  }
}

/* ===== SEU CÓDIGO ORIGINAL ===== */

.background-container {
  position: absolute;
  inset: 0;
  overflow: hidden;
  background: #001c40ff;
  z-index: 0;
}
  
.background-container img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
}
  
.background-container video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
}

.container {
  position: relative;
  z-index: 2;
  display: flex;
  justify-content: center;
  align-items: center;
  width: 100%;
  height: 100%;
}

/* =====================================================
MOLDURA DOS BOTÕES
===================================================== */

.buttons-frame{

position:absolute;

top:70%;
left:50%;

transform:translate(-50%, -50%);

width:150px;
height: 95px;

padding:25px 20px 35px 20px;

border-radius:22px;

background:rgba(5, 0, 38, 0.55);

border:2px solid rgb(0, 234, 255);

backdrop-filter:blur(10px);

box-shadow:
0 0 25px rgba(0,0,0,0.5),
0 0 12px rgba(0,140,255,0.25);

z-index:3;

display:flex;
justify-content:center;
align-items:center;

overflow:visible;

}

/* =====================================================
CONTAINER DOS BOTÕES
===================================================== */

.buttons-container {

position:relative;

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

gap:15px;

width:100%;

}
  

  
.card {

cursor:pointer;

width:90px;
height:90px;

display:flex;
justify-content:center;
align-items:center;

background:rgba(0, 40, 95, 0.85);

border:3px solid rgb(0, 234, 255);

border-radius:50%;

outline:none;

box-shadow:
0 0 20px rgba(0, 195, 255, 0.5),
0 0 40px rgba(0, 89, 255, 0.25);

color:#ffffff;

font-size:42px;
font-weight:bold;

transition:
transform 0.25s ease,
box-shadow 0.25s ease,
background 0.25s ease;

backdrop-filter:blur(6px);

}

/* HOVER */

.card:hover{

transform:scale(1.08);

box-shadow:
0 0 25px rgba(0, 234, 255, 0.9),
0 0 50px rgba(0, 140, 255, 0.5);

background:rgba(0, 60, 130, 0.95);

}

/* REMOVE CONFIGURAÇÃO ANTIGA DA IMAGEM */

.card img{

display:none;

}
  
/* =====================================================
BOTÕES SOMENTE TEXTO
===================================================== */

#btnPlay { 
    
  width: 140px;
  height: 40px;

  font-size:18px;
  font-weight:bold;

  background:transparent;
  border:none;
  outline:none;

  color:#ffffff;

  box-shadow:none;

  cursor:pointer;

  transition:0.3s;
}

#btnPlay:hover{
  transform:scale(1.08);
  color:#00eaff;
}
  
#btnPlay img{

width:130px;

height:60px;

object-fit:contain;

}

#btnSobre {
  width: 140px;
  height: 40px;

  font-size:18px;
  font-weight:bold;

  background:transparent;
  border:none;
  outline:none;

  color:#ffffff;

  box-shadow:none;

  cursor:pointer;

  transition:0.3s;
}

#btnSobre:hover{
  transform:scale(1.08);
  color:#00eaff;
}
  
#btnSobre img{

width:130px;

height:60px;

object-fit:contain;

}  

#btnCredito {
  width: 140px;
  height: 40px;

  font-size:18px;
  font-weight:bold;

  background:transparent;
  border:none;
  outline:none;

  color:#ffffff;

  box-shadow:none;

  cursor:pointer;

  transition:0.3s;
}

#btnCredito:hover{
  transform:scale(1.08);
  color:#00eaff;
}
  
#btnCredito img{

width:130px;

height:60px;

object-fit:contain;

}    
  
#btnStart{

position:absolute;

left:50%;
top:78%;

transform:translate(-50%, -50%);

width:90px;
height:90px;

z-index:9999;
  
font-size:32px;  

}

#btnStart img {
  width: 120px;
}

.card:hover {
  transform: scale(1.08);
}

@keyframes glowBtn {
  0%   { box-shadow: 0 0 16px rgba(30,144,255,0.5); }
  50%  { box-shadow: 0 0 32px rgba(30,144,255,0.9); }
  100% { box-shadow: 0 0 16px rgba(30,144,255,0.5); }
}

@media (max-width:768px) {
  .card { font-size: 18px; padding: 14px 46px; }
}

@media (max-width:480px) {
  .card { font-size: 16px; padding: 12px 38px; }
}

</style>
</head>

<body>

<!-- ÁUDIO -->
<audio id="menuClickSound" src="Audios/acerto.mp3"></audio>
  
<div class="app-wrapper">

  <div class="background-container" aria-hidden="true">
  <video id="bg-video" playsinline preload="auto">
    <source src="Video/Museu-Virtual-Introducao.mp4" type="video/mp4">
  </video>
</div>

  <audio id="bg-audio" autoplay loop muted>
  </audio>

<!-- BOTÃO 4 -->
<button id="btnStart" class="card" onclick="location.href='museuAR.html'" style="display:none;">
  ▶
</button>  
  
<!-- =====================================================
MOLDURA
===================================================== -->

<div class="buttons-frame">

  <div class="buttons-container">

  <!-- BOTÃO 1 -->
<button id="btnPlay" class="continue-btn" onclick="startIntroVideo()">

  <img src="Imagens/btn_Iniciar.png" alt="Play">

</button>
    
  <!-- BOTÃO 2 -->
<button id="btnSobre" class="sobre-btn" onclick="location.href='sobre.html'">

  <img src="Imagens/btn_Sobre2.png" alt="Sobre">

</button>
    
  <!-- BOTÃO 3 -->
  <button id="btnCredito" class="credito-btn" onclick="location.href='credito.html'">
    <img src="Imagens/btn_Credito2.png" alt="Credito">
  </button>     

</div>

</div>

</div>

<script>
  
const audio = document.getElementById('bg-audio');
const video = document.getElementById('bg-video');

const btnPlay = document.getElementById('btnPlay');
const btnSobre = document.getElementById('btnSobre');
const btnCredito = document.getElementById('btnCredito');
const btnStart = document.getElementById('btnStart');

const buttonsFrame = document.querySelector(".buttons-frame");

window.addEventListener('load', () => {
  audio.volume = 0.05;
  audio.muted = false;

  video.pause();
  video.currentTime = 0;
});

function startIntroVideo() {

  buttonsFrame.style.display = "none";

  btnPlay.style.display = "none";
  btnSobre.style.display = "none";
  btnCredito.style.display = "none";

  video.play();
  audio.play();

}

video.addEventListener("ended", () => {
  btnStart.style.display = "flex";
});
 
  
/* CLICK DOS BOTÕES  */  
  
const menuClickSound =
document.getElementById("menuClickSound");

function tocarSomBotao(){

menuClickSound.pause();

menuClickSound.currentTime=0;

menuClickSound.play().catch(()=>{});

}

/* TODOS OS BOTÕES */

document.querySelectorAll("button").forEach(btn=>{

btn.addEventListener("click",()=>{

tocarSomBotao();

});

});  
  
</script>

</body>
</html>
