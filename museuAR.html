<!DOCTYPE html>
<html lang="pt-BR">
<head>
<title>MUSEU VIRTUAL</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="style.css">

<script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>

<body>

<div id="track-message">
APONTE A CÂMERA
DO DISPOSITIVO
PARA UMA DAS 
IMAGENS NO 
AMBIENTE.
</div>
<!-- BOTÕES MONALISA -->
<button id="monaPlayButton" class="fly-btn">
  <img src="Imagens/btn_Interacao.png">
</button>
<button id="monaAudioLeftButton" class="audio-left-fly-btn">
  <img src="Imagens/btn_DaVinci.png">
</button>
<button id="monaAudioRightButton" class="audio-right-fly-btn">
  <img src="Imagens/btn_Monalisa.png">
</button>  

 <!-- BOTÕES 14 BIS --> 
<button id="flyButton" class="fly-btn">
  <img src="Imagens/btn_Interacao.png">  
</button>
<button id="audioLeftButton" class="audio-left-fly-btn">
  <img src="Imagens/btn_Dumont.png">  
</button>
<button id="audioRightButton" class="audio-right-fly-btn">
  <img src="Imagens/btn_14bis.png">  
</button> 

<!-- AUDIOS -->

  <!-- MONALISA -->
<audio id="audioMona1" src="Audios/Narrativa_Leonardo_da_Vinci.mp3"></audio>
<audio id="audioMona2" src="Audios/Narrativa_Monalisa.mp3"></audio>
  
  <!-- 14 BIS-->
<audio id="audioFly1" src="Audios/Narrativa_Santos_Dumont.mp3"></audio>
<audio id="audioFly2" src="Audios/Narrativa_14_Bis.mp3"></audio>
<audio id="audioHelice" src="Audios/Motos_Helice.mp3" loop></audio>

<a-scene
mindar-image="imageTargetSrc: Imagens/targets.mind;"
color-space="sRGB"
renderer="colorManagement:true,physicallyCorrectLights"
xr-mode-ui="enabled:false"
device-orientation-permission-ui="enabled:false">

<a-assets>
<a-asset-item id="base" src="Modelos/base1.glb"></a-asset-item>
<a-asset-item id="mamute" src="Modelos/Mamute.glb"></a-asset-item>
<a-asset-item id="smilodon" src="Modelos/Smilodon.glb"></a-asset-item>
<a-asset-item id="14bis" src="Modelos/14_Bis.glb"></a-asset-item>
<a-asset-item id="objeto6" src="Modelos/Torre_Malakoff.glb"></a-asset-item>
<a-asset-item id="objeto7" src="Modelos/Venus_Willendorf.glb"></a-asset-item>
<a-asset-item id="objeto8" src="Modelos/objeto8.glb"></a-asset-item>
<a-asset-item id="objeto9" src="Modelos/objeto9.glb"></a-asset-item>

<video id="terrenoVideoAsset" src="Video/Terreno_Final.mp4" loop muted playsinline preload="auto"></video>
<video id="monalisaVideo" src="Video/Monalisa.mp4" playsinline preload="auto"></video>
  
</a-assets>

<a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

<!-- TRACK 0 (MEGAFAUNA) -->
<a-entity mindar-image-target="targetIndex:0">
  <a-gltf-model rotation="90 0 0" position="0 0 0" scale="0.8 0.8 0.8" src="#base"></a-gltf-model>
  <a-gltf-model rotation="90 0 0" position="0 0 0" scale="0.8 0.8 0.8" src="#mamute"></a-gltf-model>
  <a-gltf-model rotation="90 0 0" position="0 0 0" scale="0.8 0.8 0.8" src="#smilodon"></a-gltf-model>
</a-entity>

<!-- TRACK 1 (MONALISA) -->
<a-entity mindar-image-target="targetIndex:1">
  <a-plane id="monalisaPlane" material="src:#monalisaVideo; shader:flat" position="0 0.35 0.02" width="1.6" height="2.4" rotation="0 0 0"></a-plane>
</a-entity>

<!-- TRACK 2 (14 BIS) -->
<a-entity mindar-image-target="targetIndex:2">
  <a-plane id="terrenoPlane" material="src:#terrenoVideoAsset; shader:flat"
  position="0 0 0" height="2" width="3" rotation="0 0 -90">
</a-plane>
<a-gltf-model id="aviao14bis" rotation="90 0 0" position="0 0 0"
  scale="0.8 0.8 0.8" src="#14bis">
</a-gltf-model>
  <a-light type="ambient" color="#ffffff" intensity="1.4"></a-light>
  <a-light type="hemisphere" color="#ffffff" groundColor="#b5b5b5" intensity="1.2"></a-light>
  <a-light type="directional" color="#fff8e5" intensity="2.8" position="-2 -4 3"></a-light>
  <a-light type="directional" color="#d6ecff" intensity="0.8" position="-3 2 -2"></a-light>
</a-entity>

<!-- TRACK 5 -->
<a-entity mindar-image-target="targetIndex:5">
  <a-gltf-model rotation="0 0 0" position="0 -0.25 0" scale="0.05 0.05 0.05" src="#objeto6"></a-gltf-model>
</a-entity>

</a-scene>

<script src="main.js"></script>

</body>
</html>
