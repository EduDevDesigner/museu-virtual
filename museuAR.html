<a-scene
mindar-image="imageTargetSrc: Imagens/targets.mind;"
color-space="sRGB"
renderer="colorManagement:true;
physicallyCorrectLights:true;
shadowMap.enabled:true;
shadowMap.type:PCFSoftShadowMap"
xr-mode-ui="enabled:false"
device-orientation-permission-ui="enabled:false">

<a-assets>
  <!-- ASSETs DE MODELOS 3D -->
<a-asset-item id="base" src="Modelos/base.glb"></a-asset-item>
<a-asset-item id="mamute" src="Modelos/Mamute2.glb"></a-asset-item>
<a-asset-item id="smilodon" src="Modelos/Smilodon.glb"></a-asset-item>
<a-asset-item id="14bis" src="Modelos/14_Bis.glb"></a-asset-item>
<a-asset-item id="torre" src="Modelos/Torre_Malakoff.glb"></a-asset-item>
<a-asset-item id="venus" src="Modelos/Venus_Willendorf.glb"></a-asset-item>
<a-asset-item id="raptor" src="Modelos/Raptor.glb"></a-asset-item>
<a-asset-item id="c_vogelherd" src="Modelos/%20Cavalo_Vogelherd.glb"></a-asset-item>
<a-asset-item id="m_vogelherd" src="Modelos/Manute_Vogelherd.glb"></a-asset-item>
<a-asset-item id="pedestal" src="Modelos/Pedestal.glb"></a-asset-item>
<a-asset-item id="moldura" src="Modelos/Moldura.glb"></a-asset-item>  
<!-- ASSETs DE VÍDEOS -->
<video id="terrenoVideoAsset" src="Video/Terreno_Final.mp4" loop muted playsinline preload="auto"></video>
<video id="monalisaVideo" src="Video/Monalisa.mp4" playsinline preload="auto"></video>
<video id="colomboVideo" src="Video/Cristovao_Colombo.mp4" playsinline preload="auto"></video>
<video id="diasVideo" src="Video/Henrique_Dias.mp4" playsinline preload="auto"></video>
<video id="dpedroIVideo" src="Video/Pedro_I.mp4" playsinline preload="auto"></video>
</a-assets>

<a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

<!-- ================= TRACK 0 O MUNDO DOS GIGANTES - VELOCIRAPTOR ================= -->
<a-entity mindar-image-target="targetIndex:0">
  <a-entity id="velociGroup" rotation="0 0 180">
    <a-gltf-model id="velociBase" rotation="90 0 0" position="0 0 0" scale="0.5 0.5 0.5" src="#base" material="shader:shadow"
  shadow="receive:true"></a-gltf-model>
    <a-gltf-model id="velociModel" rotation="90 0 0" position="0 0 0.1" scale="0.6 0.6 0.6" src="#raptor" shadow="cast:true" ></a-gltf-model>    
  </a-entity>
  <a-plane id="velociFog" color="#d9f1ff" opacity="0" width="2.8" height="2.8" rotation="-90 0 0" position="0 -0.15 0"></a-plane>
  <a-light type="ambient" color="#ffffff" intensity="1.4"></a-light>
  <a-light type="hemisphere" color="#ffffff" groundColor="#b5b5b5" intensity="1.2"></a-light>
  <a-light type="directional" color="#fff8e5" intensity="3.8" position="-2 -4 3"></a-light>
  <a-light type="directional" color="#d6ecff" intensity="2.8" position="-3 2 -2" castShadow="true" shadowMapWidth="1024" shadowMapHeight="1024"
  shadowCameraTop="5" shadowCameraBottom="-5" shadowCameraLeft="-5" shadowCameraRight="5"></a-light>
</a-entity>
  
<!-- ================= TRACK 1 ERA GLACIAL - MEGAFAUNA ================= -->
<a-entity mindar-image-target="targetIndex:1">
  <a-entity id="faunaGroup" rotation="0 0 -90">
    <a-gltf-model id="faunaBase" rotation="90 0 0" position="0 0 0" scale="0.5 0.5 0.5" src="#base"></a-gltf-model>
    <a-gltf-model id="mamuteModel" rotation="90 0 0" position="0 0.3 0.08" scale="0.5 0.5 0.5" src="#mamute"></a-gltf-model>
    <a-gltf-model id="smilodonModel" rotation="90 0 0" position="0 0 0" scale="0.5 0.5 0.5" src="#smilodon"></a-gltf-model>
  </a-entity>
  <a-plane id="faunaFog" color="#d9f1ff" opacity="0" width="2.8" height="2.8" rotation="-90 0 0" position="0 -0.15 0"></a-plane>
  <a-light type="ambient" color="#ffffff" intensity="5.4"></a-light>
  <a-light type="hemisphere" color="#ffffff" groundColor="#b5b5b5" intensity="4.2"></a-light>
  <a-light type="directional" color="#fff8e5" intensity="1.8" position="-2 -4 3"></a-light>
  <a-light type="directional" color="#d6ecff" intensity="0.8" position="-3 2 -2"></a-light>
</a-entity>

<!-- ================= TRACK 2 OS PRIMEIROS SÍMBOLOS HUMANOS - VENUS ================= -->
<a-entity mindar-image-target="targetIndex:2">
  <a-entity id="venusGroup" rotation="0 0 0">
     <a-gltf-model id="venusModel" rotation="90 0 0" position="0 0 1.5" scale="0.7 0.7 0.7" src="#venus"></a-gltf-model>    
  </a-entity>   
  <a-gltf-model id="pedestalModel" rotation="90 0 0" position="0 0 0" scale="0.7 0.7 0.7" src="#pedestal"></a-gltf-model>
  <a-light type="ambient" color="#ffffff" intensity="1.4"></a-light>
  <a-light type="hemisphere" color="#ffffff" groundColor="#b5b5b5" intensity="1.2"></a-light>
  <a-light type="directional" color="#fff8e5" intensity="2.8" position="-2 -4 3"></a-light>
  <a-light type="directional" color="#d6ecff" intensity="0.8" position="-3 2 -2"></a-light>
  
</a-entity>
  
<!-- ================= TRACK 3 ARTE E SOBREVIVÊNCIA NO PALEOLÍTICO - Cavalo e Mamute de Vogelherd ================= -->
<a-entity mindar-image-target="targetIndex:3">
  <a-entity id="vogelherdGroup" rotation="0 0 0">
     <a-gltf-model id="cavaloModel" rotation="90 0 0" position="0.3 0 0.7" scale="0.8 0.8 0.8" src="#c_vogelherd"></a-gltf-model>
     <a-gltf-model id="mamutevModel" rotation="90 0 0" position="-0.3 0 0.7" scale="0.8 0.8 0.8" src="#m_vogelherd"></a-gltf-model>
  </a-entity>   
  <a-gltf-model id="pedestalModel2" rotation="90 0 0" position="0 0 0" scale="0.7 0.7 0.7" src="#pedestal"></a-gltf-model>
  <a-light type="ambient" color="#ffffff" intensity="1.4"></a-light>
  <a-light type="hemisphere" color="#ffffff" groundColor="#b5b5b5" intensity="1.2"></a-light>
  <a-light type="directional" color="#fff8e5" intensity="2.8" position="-2 -4 3"></a-light>
  <a-light type="directional" color="#d6ecff" intensity="0.8" position="-3 2 -2"></a-light>
  
</a-entity>
  
<!-- ================= TRACK 4 As Grandes Navegações — Cristóvão Colombo ================= -->
<a-entity mindar-image-target="targetIndex:4">
  <a-plane id="colomboPlane" material="src:#colomboVideo; shader:flat" position="0 0 0" width="1.6" height="2.4"></a-plane>
  <a-gltf-model id="moldura1" rotation="90 0 0" position="0 0 -0.03" width="1.6" height="2.4" src="#moldura"></a-gltf-model>
  <a-light type="ambient" color="#ffffff" intensity="1.4"></a-light>
  <a-light type="hemisphere" color="#ffffff" groundColor="#b5b5b5" intensity="1.2"></a-light>
  <a-light type="directional" color="#fff8e5" intensity="2.8" position="-2 -4 3"></a-light>
  <a-light type="directional" color="#d6ecff" intensity="0.8" position="-3 2 -2"></a-light>
</a-entity>

  
<!-- ================= TRACK 5 O RENASCIMENTO - LEONARDO E MONALISA ================= -->
<a-entity mindar-image-target="targetIndex:5">
  <a-plane id="monalisaPlane" material="src:#monalisaVideo; shader:flat" position="0 0 0" width="1.6" height="2.4"></a-plane>
  <a-gltf-model id="moldura2" rotation="90 0 0" position="0 0 -0.03" width="1.6" height="2.4" src="#moldura"></a-gltf-model>
  <a-light type="ambient" color="#ffffff" intensity="1.4"></a-light>
  <a-light type="hemisphere" color="#ffffff" groundColor="#b5b5b5" intensity="1.2"></a-light>
  <a-light type="directional" color="#fff8e5" intensity="2.8" position="-2 -4 3"></a-light>
  <a-light type="directional" color="#d6ecff" intensity="0.8" position="-3 2 -2"></a-light>
</a-entity>
  
<!-- ================= TRACK 6 HENRIQUE DIAS ================= -->
<a-entity mindar-image-target="targetIndex:6">
  <a-plane id="diasPlane" material="src:#diasVideo; shader:flat" position="0 0 0" width="1.6" height="2.4"></a-plane>
  <a-gltf-model id="moldura3" rotation="90 0 0" position="0 0 -0.03" width="1.6" height="2.4" src="#moldura"></a-gltf-model>
  <a-light type="ambient" color="#ffffff" intensity="1.4"></a-light>
  <a-light type="hemisphere" color="#ffffff" groundColor="#b5b5b5" intensity="1.2"></a-light>
  <a-light type="directional" color="#fff8e5" intensity="2.8" position="-2 -4 3"></a-light>
  <a-light type="directional" color="#d6ecff" intensity="0.8" position="-3 2 -2"></a-light>
</a-entity>  

<!-- ================= TRACK 7 História do Brasil — Dom Pedro I ================= -->
<a-entity mindar-image-target="targetIndex:7">
  <a-plane id="dpedroIPlane" material="src:#dpedroIVideo; shader:flat" position="0 0 0" width="1.6" height="2.4"></a-plane>
  <a-gltf-model id="moldura4" rotation="90 0 0" position="0 0 -0.03" width="1.6" height="2.4" src="#moldura"></a-gltf-model>
  <a-light type="ambient" color="#ffffff" intensity="1.4"></a-light>
  <a-light type="hemisphere" color="#ffffff" groundColor="#b5b5b5" intensity="1.2"></a-light>
  <a-light type="directional" color="#fff8e5" intensity="2.8" position="-2 -4 3"></a-light>
  <a-light type="directional" color="#d6ecff" intensity="0.8" position="-3 2 -2"></a-light>
</a-entity>    
  
<!-- ================= TRACK 8 REVOLUÇÃO DOS TRANSPORTES - SANTOS DUMONT E 14 BIS ================= -->
<a-entity mindar-image-target="targetIndex:8">
  <a-plane id="terrenoPlane" material="src:#terrenoVideoAsset; shader:flat" position="0 0.03 0" height="2" width="3" rotation="0 0 -90"></a-plane>
  <a-gltf-model id="aviao14bis" rotation="90 0 0" position="0 0 0" scale="0.8 0.8 0.8" src="#14bis"></a-gltf-model>
  <a-gltf-model id="moldura5" rotation="90 0 0" position="0 0 -0.05" scale="1.3 1.3 1.3" src="#moldura"></a-gltf-model>
  <a-light type="ambient" color="#ffffff" intensity="1.4"></a-light>
  <a-light type="hemisphere" color="#ffffff" groundColor="#b5b5b5" intensity="1.2"></a-light>
  <a-light type="directional" color="#fff8e5" intensity="2.8" position="-2 -4 3"></a-light>
  <a-light type="directional" color="#d6ecff" intensity="0.8" position="-3 2 -2"></a-light>
</a-entity>

<!-- ================= TRACK 9 PATRIMÔNIO URBANO E CULTURAL DE PERNAMBUCO - TORRE MALAKOFF ================= -->
<a-entity mindar-image-target="targetIndex:9">
  <a-entity id="torreGroup" rotation="0 0 0">
     <a-gltf-model id="torreModel" rotation="90 0 0" position="0 0 0" scale="0.8 0.8 0.8" src="#torre"></a-gltf-model>
  </a-entity>  
  <a-light type="ambient" color="#ffffff" intensity="1.4"></a-light>
  <a-light type="hemisphere" color="#ffffff" groundColor="#b5b5b5" intensity="1.2"></a-light>
  <a-light type="directional" color="#fff8e5" intensity="2.8" position="-2 -4 3"></a-light>
  <a-light type="directional" color="#d6ecff" intensity="0.8" position="-3 2 -2"></a-light>
</a-entity>

</a-scene>
