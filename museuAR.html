<!DOCTYPE html>
<html lang="pt-BR">
<head>
<title>MUSEU VIRTUAL</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="style.css">

<script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>

#track-message{
position: fixed;
top: 50%;
left: 50%;
transform: translate(-50%, -50%);
background:#004aadff;
color:#ffffff;
font-family:'Changa One',sans-serif;
font-size:1em;
padding:10px 20px;
border-radius:8px;
text-align:center;
z-index:9999;
}

.hidden{display:none!important;}

.audio-btn{
position: fixed;
bottom:40px;
left:50%;
transform:translateX(-50%);
background:transparent;
border:none;
padding:0;
z-index:9999;
display:none;
cursor:pointer;
}

.audio-btn img{width:70px;}

.terra-btn{
position: fixed;
bottom:40px;
left:calc(50% + 90px);
background:transparent;
border:none;
padding:0;
z-index:9999;
display:none;
cursor:pointer;
}

.terra-btn img{width:70px;}

.relevo-btn{
position: fixed;
bottom:40px;
left:calc(50% - 160px);
background:transparent;
border:none;
padding:0;
z-index:9999;
display:none;
cursor:pointer;
}

.relevo-btn img{width:70px;}

/* NOVO BOTÃO TRACK 2 */
.fly-btn{
position: fixed;
bottom:30px;
left:50%;
transform:translateX(-50%);
background:transparent;
border:none;
border-radius:10px;
z-index:9999;
display:none;
cursor:pointer;
padding:0;
}

.fly-btn img{
width:125px;
display:block;
}

/* NOVOS BOTÕES DE ÁUDIO TRACK 2 */
.audio-left-btn{
position: fixed;
bottom:38px;
left:calc(50% - 110px);
background:transparent;
border:none;
padding:0;
z-index:9999;
display:none;
cursor:pointer;
}

.audio-left-btn img{
width:115px;
display:block;
}

.audio-right-btn{
position: fixed;
bottom:38px;
left:calc(50% + 45px);
background:transparent;
border:none;
padding:0;
z-index:9999;
display:none;
cursor:pointer;
}

.audio-right-btn img{
width:115px;
display:block;
}

</style>
</head>

<body>

<div id="track-message">
APONTE A CÂMERA
DO DISPOSITIVO
PARA UMA DAS 
IMAGENS NO 
AMBIENTE.
</div>

<button id="flyButton" class="fly-btn">
  <img src="Imagens/btn_Interacao.png">  
</button>

<button id="audioLeftButton" class="audio-left-btn">
  <img src="Imagens/btn_Historia.png">  
</button>

<button id="audioRightButton" class="audio-right-btn">
  <img src="Imagens/btn_fatos.png">  
</button>
  
<!-- BOTÕES -->
<!--
<button id="audioButton" class="audio-btn">
<img src="Imagens/btn_ouvir.png">
</button>

<button id="terraButton" class="terra-btn">
<img src="Imagens/btn_terra.png">
</button>

<button id="relevoButton" class="relevo-btn">
<img src="Imagens/btn_relevo.png">
</button>
-->
  
<!-- AUDIOS -->
<audio id="audio0" src="Audios/audio0.mp3"></audio>
<audio id="audio1" src="Audios/audio1.mp3"></audio>
<audio id="audio2" src="Audios/audio2.mp3"></audio>
<audio id="audio3" src="Audios/audio3.mp3"></audio>
<audio id="audio4" src="Audios/audio4.mp3"></audio>
<audio id="audio5" src="Audios/audio5.mp3"></audio>
<audio id="audio6" src="Audios/audio6.mp3"></audio>
<audio id="audio7" src="Audios/audio7.mp3"></audio>
<audio id="audio8" src="Audios/audio8.mp3"></audio>

<!-- NOVOS AUDIOS TRACK 2 -->
<audio id="audioFly1" src="Audios/audioFly1.mp3"></audio>
<audio id="audioFly2" src="Audios/audioFly2.mp3"></audio>

<a-scene
mindar-image="imageTargetSrc: Imagens/targets.mind;"
color-space="sRGB"
renderer="colorManagement:true,physicallyCorrectLights"
xr-mode-ui="enabled:false"
device-orientation-permission-ui="enabled:false">

<a-assets>

<a-asset-item id="base" src="Modelos/base1.glb"></a-asset-item>
<a-asset-item id="mamute" src="Modelos/Mamute.glb"></a-asset-item>
<a-asset-item id="smilodon" src="Modelos/Smilodon.glb"></a-asset-item>
<a-asset-item id="14bis" src="Modelos/14_Bis.glb"></a-asset-item>
<a-asset-item id="objeto6" src="Modelos/Torre_Malakoff.glb"></a-asset-item>
<a-asset-item id="objeto7" src="Modelos/Venus_Willendorf.glb"></a-asset-item>
<a-asset-item id="objeto8" src="Modelos/objeto8.glb"></a-asset-item>
<a-asset-item id="objeto9" src="Modelos/objeto9.glb"></a-asset-item>

</a-assets>

<a-video id="terreno" src="Video/Terreno.mp4"  loop muted playsinline></a-video>
<a-camera position="0 0 0" look-controls="enabled:false"></a-camera>
   
<!-- TRACK 0 -->
<a-entity mindar-image-target="targetIndex:0">
  <a-gltf-model rotation="90 0 0 " position="0 0 0" scale="0.8 0.8 0.8" src="#base"></a-gltf-model>
  <a-gltf-model rotation="90 0 0 " position="0 0 0" scale="0.8 0.8 0.8" src="#mamute"></a-gltf-model>
  <a-gltf-model rotation="90 0 0 " position="0 0 0" scale="0.8 0.8 0.8" src="#smilodon"></a-gltf-model>
</a-entity>
  
<!-- TRACK 1 -->
<a-entity mindar-image-target="targetIndex: 1">
   <a-gltf-model rotation="90 0 0 " position="0 0 0" scale="0.8 0.8 0.8" src="#base"></a-gltf-model>
</a-entity>
  
<!-- TRACK 2 -->
<a-entity mindar-image-target="targetIndex: 2">
  <a-plane id="terrenoPlane" src="#terreno" position="0 0 0" height="2" width="3" rotation="0 0 -90" shadow="receive: true" terreno-movel></a-plane>
  <a-gltf-model id="aviao14bis" rotation="90 0 0" position="0 0.2 0" scale="0.8 0.8 0.8" src="#14bis" shadow="cast: true; receive: true"></a-gltf-model>
  <a-light type="ambient" color="#ffffff" intensity="1.4"></a-light>
  <a-light type="hemisphere" color="#ffffff" groundColor="#b5b5b5" intensity="1.2"></a-light>
  <a-light type="directional" color="#fff8e5" intensity="2.8" position="-2 -4 3" castShadow="true"></a-light>
  <a-light type="directional" color="#d6ecff" intensity="0.8" position="-3 2 -2"></a-light>
</a-entity>
  
<!-- TRACK 5 -->
<a-entity mindar-image-target="targetIndex: 5">
<a-gltf-model rotation="0 0 0 " position="0 -0.25 0" scale="0.05 0.05 0.05" src="#objeto6"></a-gltf-model>
</a-entity>

</a-scene>

<script>

const message=document.getElementById("track-message")
const flyButton=document.getElementById("flyButton")
const audioLeftButton=document.getElementById("audioLeftButton")
const audioRightButton=document.getElementById("audioRightButton")

const audioFly1=document.getElementById("audioFly1")
const audioFly2=document.getElementById("audioFly2")

const aviao14bis=document.getElementById("aviao14bis")

let velocidadeTerreno=0
let alturaAtual=0.2
let flyActive=false
let subirTimeout=null
let target2Ativo=false

const targets=document.querySelectorAll('[mindar-image-target]')

targets.forEach((target,index)=>{

target.addEventListener("targetFound",()=>{

message.classList.add("hidden")

if(index===2){
  flyButton.style.display="block"
  audioLeftButton.style.display="block"
  audioRightButton.style.display="block"
  target2Ativo=true
}else{
  flyButton.style.display="none"
  audioLeftButton.style.display="none"
  audioRightButton.style.display="none"
  target2Ativo=false
}

})

target.addEventListener("targetLost",()=>{

flyButton.style.display="none"
audioLeftButton.style.display="none"
audioRightButton.style.display="none"

audioFly1.pause()
audioFly1.currentTime=0

audioFly2.pause()
audioFly2.currentTime=0

target2Ativo=false
flyActive=false
clearTimeout(subirTimeout)
alturaAtual=0.2
aviao14bis.setAttribute("position","0 0 0.2")
velocidadeTerreno=0

message.classList.remove("hidden")

})

})

flyButton.addEventListener("mousedown", iniciarVoo)
flyButton.addEventListener("touchstart", iniciarVoo)

flyButton.addEventListener("mouseup", pararVoo)
flyButton.addEventListener("mouseleave", pararVoo)
flyButton.addEventListener("touchend", pararVoo)

function iniciarVoo(){
if(!target2Ativo) return

flyActive=true
velocidadeTerreno=0.0007

subirTimeout=setTimeout(()=>{
if(flyActive){
subirAviao()
}
},2000)
}

function pararVoo(){
flyActive=false
clearTimeout(subirTimeout)
descerAviao()
desacelerarTerreno()
}

function subirAviao(){
let subida=setInterval(()=>{
if(!flyActive){
clearInterval(subida)
return
}

if(alturaAtual<0.8){
alturaAtual+=0.01
aviao14bis.setAttribute("position",`0  0 ${alturaAtual}`)
}else{
clearInterval(subida)
planarAviao()
}
},30)
}

function planarAviao(){
let direcao=1

let planar=setInterval(()=>{
if(!flyActive){
clearInterval(planar)
return
}

alturaAtual+=0.003*direcao

if(alturaAtual>0.85) direcao=-1
if(alturaAtual<0.75) direcao=1

aviao14bis.setAttribute("position",`0  0 ${alturaAtual}`)
},40)
}

function descerAviao(){
let descida=setInterval(()=>{
if(alturaAtual>0.2){
alturaAtual-=0.01
aviao14bis.setAttribute("position",`0  0 ${alturaAtual}`)
}else{
clearInterval(descida)
}
},30)
}

function desacelerarTerreno(){
let reduzir=setInterval(()=>{
if(velocidadeTerreno>0){
velocidadeTerreno-=0.00003
}else{
velocidadeTerreno=0
clearInterval(reduzir)
}
},40)
}

audioLeftButton.addEventListener("click",()=>{
audioFly2.pause()
audioFly2.currentTime=0

if(audioFly1.paused){
audioFly1.play()
}else{
audioFly1.pause()
}
})

audioRightButton.addEventListener("click",()=>{
audioFly1.pause()
audioFly1.currentTime=0

if(audioFly2.paused){
audioFly2.play()
}else{
audioFly2.pause()
}
})

</script>

</body>
</html>
