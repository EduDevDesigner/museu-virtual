<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preparação - WebAR</title>

<style>

/* ===== RESET + ALTURA TOTAL ===== */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Orbitron', sans-serif;
}

html, body {
  width: 100%;
  height: 100%;
}

/* ===== BODY SEM IMAGEM ===== */
body {
  background: #001c40;
  color: #fff;
  overflow: hidden;
}

/* ===== WRAPPER (CONTROLA O FUNDO) ===== */
.app-wrapper {
  width: 100%;
  height: 100%;
  position: relative;
  overflow: hidden;

  /* FUNDO PRINCIPAL */
  background: url('Imagens/tutorial.jpg') center no-repeat;
  background-size: cover;
}

/* ===== DESKTOP (FRAME CELULAR) ===== */
@media (min-width: 768px) {
  body {
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .app-wrapper {
    width: 390px;
    height: 844px;
    box-shadow: 0 0 40px rgba(0,0,0,0.6);
  }
}

/* ===== OVERLAY ===== */
#intro-overlay {
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0); /* leve escurecimento */
  display: flex;
  justify-content: center;
  align-items: center;
  animation: fadeIn 0.8s ease;
}

/* ===== CAIXA ===== */
.intro-box {
  text-align: center;
  max-width: 320px;
  padding: 20px;
}

/* ===== TÍTULO ===== */
.intro-box h1 {
  font-size: 28px;
  margin-bottom: 25px;
  letter-spacing: 2px;
  animation: glowTitle 2s infinite alternate;
}

/* ===== PASSOS ===== */
.steps {
  display: flex;
  flex-direction: column;
  gap: 18px;
  margin-bottom: 30px;
}

.step {
  display: flex;
  align-items: center;
  gap: 12px;
  opacity: 0;
  transform: translateY(20px);
  animation: slideUp 0.6s forwards;
}

.step:nth-child(1) { animation-delay: 0.3s; }
.step:nth-child(2) { animation-delay: 0.6s; }
.step:nth-child(3) { animation-delay: 0.9s; }

.step span {
  font-size: 26px;
}

.step p {
  font-size: 16px;
}

/* ===== BOTÃO ===== */
.intro-box button {
  padding: 14px 40px;
  border: none;
  border-radius: 999px;
  background: linear-gradient(45deg, #00c6ff, #0072ff);
  color: white;
  font-size: 18px;
  letter-spacing: 1px;
  cursor: pointer;
  box-shadow: 0 0 20px rgba(0,114,255,0.6);
  transition: 0.3s;
}

.intro-box button:hover {
  transform: scale(1.1);
  filter: brightness(1.2);
}

/* ===== ANIMAÇÕES ===== */
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes fadeOut {
  to { opacity: 0; }
}

@keyframes slideUp {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes glowTitle {
  from { text-shadow: 0 0 10px #00c6ff; }
  to { text-shadow: 0 0 25px #0072ff; }
}

</style>
</head>

<body>

<div class="app-wrapper">

  <div id="intro-overlay">
    <div class="intro-box">

      <h1>Prepare-se</h1>

      <div class="steps">
        <div class="step">
          <span>📷</span>
          <p>Permita o uso da câmera</p>
        </div>
        
        <div class="step">
          <span>📱</span>
          <p>Aponte para uma imagem</p>
        </div>
      </div>

      <button onclick="startAR()">Entrar</button>

    </div>
  </div>

</div>

<script>
function startAR() {
  const overlay = document.getElementById("intro-overlay");

  overlay.style.animation = "fadeOut 0.6s ease forwards";

  setTimeout(() => {
    window.location.href = "museuAR.html";
  }, 600);
}
</script>

</body>
</html>
